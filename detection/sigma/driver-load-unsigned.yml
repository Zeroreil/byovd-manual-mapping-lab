title: Unsigned or Test-Signed Driver Loaded
id: 9c2e7d4a-1f6b-4a8c-9e3d-2b5c7a1f6d84
status: experimental
description: Detects driver image loads where the signature is unavailable or test-signed.
references:
  - https://learn.microsoft.com/sysinternals/downloads/sysmon
  - https://attack.mitre.org/techniques/T1543/003/
author: HyperR0 Lab
date: 2026/11/09
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 6
    SignatureStatus: 'Unavailable'
  filter_known:
    ImageLoaded|startswith:
      - 'C:\Windows\System32\drivers\'
  condition: selection and not filter_known
falsepositives:
  - Development/test drivers in a lab
  - Security products with embedded drivers
level: high
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1543.003
